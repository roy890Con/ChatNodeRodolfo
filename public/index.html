<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Node.js - Rodolfo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; display: flex; flex-direction: column; height: 90vh; }
    #chat { flex: 1; overflow-y: auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; }
    #messages { list-style-type: none; padding: 0; margin: 0; }
    #messages li { padding: 10px 14px; margin-bottom: 10px; background: #e9ecef; border-radius: 8px; word-wrap: break-word; }
    #messages img, #messages video { max-width: 100%; max-height: 250px; border-radius: 5px; display: block; margin-top: 8px; }
    form { display: flex; gap: 10px; align-items: center; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #0056b3; }
    .file-label { padding: 10px; background: #6c757d; color: white; border-radius: 5px; cursor: pointer; font-size: 14px; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <h2>Chat en Tiempo Real 💬</h2>
  <div id="chat">
    <ul id="messages"></ul>
  </div>

  <form id="form" action="">
    <label for="file-input" class="file-label">📎 Adjuntar</label>
    <input type="file" id="file-input" />
    <input id="input" autocomplete="off" placeholder="Escribe un mensaje..." />
    <button>Enviar</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const fileInput = document.getElementById('file-input');
    const messages = document.getElementById('messages');

    // Reproducir un bip de notificación con Web Audio API (no requiere archivo mp3 local)
    function playNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.log("Audio no permitido aún por interacción del usuario");
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          socket.emit('chat message', {
            text: input.value,
            file: evt.target.result,
            fileName: file.name,
            fileType: file.type
          });
          input.value = '';
          fileInput.value = '';
        };
        reader.readAsDataURL(file);
      } else if (input.value) {
        socket.emit('chat message', { text: input.value });
        input.value = '';
      }
    });

    socket.on('chat message', (data) => {
      playNotificationSound();
      const item = document.createElement('li');

      if (typeof data === 'string') {
        item.textContent = data;
      } else {
        if (data.text) {
          const textSpan = document.createElement('div');
          textSpan.textContent = data.text;
          item.appendChild(textSpan);
        }

        if (data.file) {
          if (data.fileType.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = data.file;
            item.appendChild(img);
          } else if (data.fileType.startsWith('video/')) {
            const video = document.createElement('video');
            video.src = data.file;
            video.controls = true;
            item.appendChild(video);
          } else {
            const link = document.createElement('a');
            link.href = data.file;
            link.download = data.fileName || 'archivo';
            link.textContent = '📄 Descargar archivo: ' + (data.fileName || 'Adjunto');
            link.target = '_blank';
            item.appendChild(link);
          }
        }
      }

      messages.appendChild(item);
      window.scrollTo(0, document.body.scrollHeight);
    });
  </script>
</body>
</html>
