<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica de evaluación Socket</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 90vh; }
    h2 { color: #337ab7; text-align: center; font-size: 20px; margin-bottom: 25px; }
    
    /* Pantalla de login */
    #login-screen { display: flex; flex-direction: column; width: 100%; max-width: 450px; margin-top: 50px; }
    #username-input { padding: 12px; border: 1px solid #ccc; border-radius: 3px; margin-bottom: 12px; font-size: 14px; text-align: center; }
    #login-btn { padding: 12px; background-color: #337ab7; color: white; border: none; border-radius: 3px; font-size: 15px; cursor: pointer; }
    #login-btn:hover { background-color: #286090; }

    /* Pantalla del chat */
    #chat-screen { display: none; width: 100%; max-width: 600px; flex-direction: column; }
    .chat-header-btn { align-self: flex-end; background-color: #337ab7; color: white; border: none; padding: 8px 16px; border-radius: 3px; font-size: 13px; margin-bottom: 10px; }
    #chat-box { border: 1px solid #e2e2e2; height: 350px; overflow-y: auto; padding: 15px; background: #fafafa; border-radius: 3px; margin-bottom: 15px; }
    
    #messages { list-style: none; padding: 0; margin: 0; }
    #messages li { margin-bottom: 12px; padding: 8px 12px; background: #ffffff; border: 1px solid #eee; border-radius: 4px; word-wrap: break-word; }
    #messages .username-tag { font-weight: bold; color: #337ab7; margin-bottom: 4px; font-size: 14px; }
    #messages img, #messages video { max-width: 100%; max-height: 250px; border-radius: 4px; margin-top: 6px; display: block; }
    
    form { display: flex; gap: 8px; align-items: center; }
    #input-message { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 3px; }
    .file-btn { background-color: #6c757d; color: white; padding: 10px 14px; border-radius: 3px; cursor: pointer; font-size: 13px; }
    input[type="file"] { display: none; }
    #send-btn { background-color: #337ab7; color: white; border: none; padding: 10px 25px; border-radius: 3px; cursor: pointer; }
    #send-btn:hover { background-color: #286090; }
  </style>
</head>
<body>

  <h2>Práctica de evaluación usando Sockets de comunicación - Ing. Alex R.G.</h2>

  <!-- 1. Pantalla de inicio de sesión -->
  <div id="login-screen">
    <input type="text" id="username-input" placeholder="Ingresa tu nombre" autocomplete="off" />
    <button id="login-btn">Ingresar al chat</button>
  </div>

  <!-- 2. Pantalla principal del chat -->
  <div id="chat-screen">
    <button class="chat-header-btn">Chat con socket</button>
    <div id="chat-box">
      <ul id="messages"></ul>
    </div>
    <form id="form">
      <label for="file-input" class="file-btn">📎 Archivo</label>
      <input type="file" id="file-input" />
      <input type="text" id="input-message" placeholder="Escribe un mensaje..." autocomplete="off" />
      <button id="send-btn">Enviar</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUsername = '';

    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const loginBtn = document.getElementById('login-btn');
    const form = document.getElementById('form');
    const inputMessage = document.getElementById('input-message');
    const fileInput = document.getElementById('file-input');
    const messages = document.getElementById('messages');

    // Generador de tono de notificación (sonido de chat doble bip)
    function playChatSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Primer tono (Agudo)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain1.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(audioCtx.currentTime);
        osc1.stop(audioCtx.currentTime + 0.08);

        // Segundo tono (Más agudo - efecto "pop")
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.09);
        gain2.gain.setValueAtTime(0.15, audioCtx.currentTime + 0.09);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(audioCtx.currentTime + 0.09);
        osc2.stop(audioCtx.currentTime + 0.18);
      } catch (e) {
        console.log("Audio requiere interacción de usuario");
      }
    }

    // Iniciar Sesión
    loginBtn.addEventListener('click', () => {
      const name = usernameInput.value.trim();
      if (name) {
        currentUsername = name;
        loginScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
      }
    });

    // Enviar mensaje o archivo
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          socket.emit('chat message', {
            user: currentUsername,
            text: inputMessage.value,
            file: evt.target.result,
            fileName: file.name,
            fileType: file.type
          });
          inputMessage.value = '';
          fileInput.value = '';
        };
        reader.readAsDataURL(file);
      } else if (inputMessage.value.trim()) {
        socket.emit('chat message', {
          user: currentUsername,
          text: inputMessage.value
        });
        inputMessage.value = '';
      }
    });

    // Recibir mensajes en vivo
    socket.on('chat message', (data) => {
      playChatSound(); // Reproduce sonido
      
      const item = document.createElement('li');
      const userTag = document.createElement('div');
      userTag.className = 'username-tag';
      userTag.textContent = data.user ? data.user + ':' : 'Anónimo:';
      item.appendChild(userTag);

      if (data.text) {
        const textDiv = document.createElement('div');
        textDiv.textContent = data.text;
        item.appendChild(textDiv);
      }

      if (data.file) {
        if (data.fileType && data.fileType.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = data.file;
          item.appendChild(img);
        } else if (data.fileType && data.fileType.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = data.file;
          video.controls = true;
          item.appendChild(video);
        } else {
          const link = document.createElement('a');
          link.href = data.file;
          link.download = data.fileName || 'archivo';
          link.textContent = '📄 Descargar: ' + (data.fileName || 'Adjunto');
          link.target = '_blank';
          item.appendChild(link);
        }
      }

      messages.appendChild(item);
      const chatBox = document.getElementById('chat-box');
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
